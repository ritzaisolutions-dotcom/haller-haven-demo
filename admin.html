<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Admin · Objekte · Haller</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #F8F8F8;
      --card: #FFFFFF;
      --line: #E2E2E2;
      --txt: #222222;
      --mut: #6B6B6B;
      --acc: #0073E1;
      --acc-deep: #5472D2;
      --ghost: #959898;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Inter, system-ui, sans-serif;
      background: var(--bg);
      color: var(--txt);
      min-height: 100vh;
      line-height: 1.5;
      font-size: 15px;
    }
    :focus-visible { outline: 2px solid var(--acc); outline-offset: 3px; }
    :focus:not(:focus-visible) { outline: none; }
    .wrap { max-width: 920px; margin: 0 auto; padding: 28px 20px 80px; }
    h1 {
      font-family: Fraunces, serif;
      font-size: clamp(26px, 4vw, 34px);
      font-weight: 500;
      letter-spacing: -0.02em;
    }
    .mut { color: var(--mut); font-size: 13px; margin-top: 6px; }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      padding: 24px;
      margin-top: 18px;
    }
    label {
      display: block;
      font-size: 12px;
      color: var(--mut);
      margin-top: 12px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    input, select, textarea {
      width: 100%;
      margin-top: 6px;
      padding: 12px;
      background: var(--bg);
      border: 1px solid var(--line);
      color: var(--txt);
      font: inherit;
      border-radius: 0;
    }
    input:focus, select:focus, textarea:focus {
      border-color: var(--acc);
      outline: none;
    }
    textarea { min-height: 88px; resize: vertical; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    button {
      margin-top: 14px;
      background: var(--acc);
      color: #fff;
      border: 1px solid var(--acc);
      padding: 11px 16px;
      font: inherit;
      font-size: 12px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
    }
    button:hover { background: var(--acc-deep); border-color: var(--acc-deep); }
    button.ghost {
      background: transparent;
      border: 1px solid var(--ghost);
      color: var(--txt);
    }
    button.ghost:hover {
      border-color: var(--acc);
      color: var(--acc);
      background: transparent;
    }
    button.danger {
      background: transparent;
      color: #b42318;
      border: 1px solid #f2c4c0;
    }
    button.danger:hover { background: #fef3f2; }
    .row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 0;
      border-bottom: 1px solid var(--line);
      align-items: center;
    }
    .row span { display: block; color: var(--mut); font-size: 12px; }
    .row button { margin-top: 0; margin-left: 8px; }
    .thumbs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .thumb {
      position: relative;
      width: 80px;
      height: 80px;
      border: 1px solid var(--line);
    }
    .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .thumb button {
      position: absolute;
      top: 0;
      right: 0;
      margin: 0;
      padding: 2px 7px;
      background: rgba(34, 34, 34, 0.85);
      border-color: transparent;
      font-size: 11px;
      letter-spacing: 0;
    }
    .warn {
      background: #eef5fc;
      border: 1px solid #c5daf5;
      color: var(--txt);
      padding: 12px 14px;
      font-size: 13px;
      margin-top: 14px;
    }
    .bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .brand-line {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
    }
    .brand-line img { height: 32px; display: block; }
    #login-msg:not(:empty) { color: #b42318; }
    #form-msg:not(:empty) { color: var(--acc); margin-top: 10px; }
    @media (max-width: 700px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="bar">
      <div>
        <div class="brand-line">
          <img src="https://haller-immobilien.de/wp-content/uploads/2024/06/logo_240.png" alt="Haller" />
        </div>
        <h1>Objekte</h1>
        <p class="mut">Admin · noindex · nicht in der öffentlichen Navigation</p>
      </div>
      <button type="button" class="ghost" id="out" hidden>Raus</button>
    </div>

    <section id="gate" class="card">
      <label>Passwort <input id="pw" type="password" autocomplete="current-password" /></label>
      <button type="button" id="go">Rein</button>
      <p class="mut" id="login-msg" style="margin-top:10px"></p>
      <p class="warn">Login über Vercel Env <strong>ADMIN_PASSWORD</strong>. Ohne Env → 503. Passwort nicht im Repo speichern.</p>
    </section>

    <section id="app" hidden>
      <p class="mut">Mandant: <span id="who"></span></p>
      <div class="card">
        <input type="hidden" id="fid" />
        <input type="hidden" id="images" value="[]" />
        <label>Titel <input id="title" required /></label>
        <div class="grid">
          <label>Preis <input id="price" placeholder="349.000 €" /></label>
          <label>Wohnfläche m² <input id="area" /></label>
          <label>Zimmer <input id="rooms" /></label>
          <label>Ort <input id="place" /></label>
        </div>
        <label>Status
          <select id="status">
            <option value="aktiv">aktiv</option>
            <option value="verkauft">verkauft</option>
          </select>
        </label>
        <label>Notiz <textarea id="note"></textarea></label>
        <label>Bilder max. 12, werden hier verkleinert
          <input id="files" type="file" accept="image/*" multiple />
        </label>
        <p class="mut" id="imgcount">0 / 12</p>
        <div class="thumbs" id="thumbs"></div>
        <button type="button" id="save">Speichern</button>
        <button type="button" class="ghost" id="reset">Neu</button>
        <p class="mut" id="form-msg"></p>
      </div>
      <div class="card">
        <div class="bar">
          <strong>In diesem Browser</strong>
          <button type="button" class="ghost" id="dl">listings.json exportieren</button>
        </div>
        <p class="warn">Besucher sehen nur <code>listings.json</code> im Repo. Nach Änderungen: exportieren → Datei ersetzen → deployen.</p>
        <div id="rows"></div>
      </div>
    </section>
  </div>
  <script src="/config.js"></script>
  <script src="/store.js"></script>
  <script src="/admin.js"></script>
</body>
</html>
