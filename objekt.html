<body class="haven">
<header class="top">
  <a class="brand" href="index.html"><img src="https://haller-immobilien.de/wp-content/uploads/2024/06/logo_240.png" alt="Haller"></a>
  <button type="button" class="nav-toggle" aria-expanded="false" aria-controls="site-nav">Menü</button>
  <nav id="site-nav"><a href="index.html">Start</a><a href="ueber-uns.html">Über uns</a><a href="leistungen.html">Leistungen</a><a href="objekte.html">Objekte</a><a href="projekte.html">Projekte</a><a href="kontakt.html">Kontakt</a></nav>

</header>

<section class="hero overlay page-hero">
  <img class="hero-media" src="https://images.unsplash.com/photo-1600607687939-ce8a6c25118c?auto=format&amp;fit=crop&amp;w=1800&amp;q=80" alt="">
  <div class="hero-copy">
    <p class="kicker">Objekt</p>
    <h1 id="xt">Objekt</h1>
  </div>
</section>

<section class="page" id="expose">
  <div id="xg"></div>
  <p><a href="objekte.html">Zurück zur Liste</a></p>
  
<form class="box" id="f" novalidate>
  <div class="ok" id="ok">Anfrage gesendet. Sie liegt in der Mail.</div>
  <input type="checkbox" name="botcheck" style="display:none" tabindex="-1" autocomplete="off">
  <input type="hidden" name="object_id" value="">
  <input type="hidden" name="object_title" value="">
  <p class="muted-note" style="margin-bottom:12px">Ihre Anfrage geht objektbezogen ins Postfach (Betreff mit Objektname).</p>
  <label>Anliegen
    <select name="intent" required>
      <option value="besichtigung">Besichtigungstermin</option>
      <option value="kaufen">Kaufinteresse / Infos</option>
      <option value="finanzierung">Finanzierung klären</option>
    </select>
  </label>
  <label>Name <input name="name" required></label>
  <label>E-Mail <input type="email" name="email" required></label>
  <label>Telefon <input name="phone" required></label>
  <label>Objekt <input name="place" readonly></label>
  <label>Wunschtermin / Notiz <textarea name="note" placeholder="z. B. Samstag Vormittag, ab 15 Uhr …"></textarea></label>
  <button class="btn" type="submit">Termin anfragen</button>
</form>
</section>
<footer>
